name: mangalclubs-core

services:
  postgres:
    image: postgres:16-alpine
    container_name: mangalclubs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mangalclubs}
      POSTGRES_USER: ${POSTGRES_USER:-mangalclubs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangalclubs_password}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - mangalclubs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}

  api:
    build:
      context: .
    image: mangalclubs-core:local
    container_name: mangalclubs-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mangalclubs}:${POSTGRES_PASSWORD:-mangalclubs_password}@postgres:5432/${POSTGRES_DB:-mangalclubs}
      MEDIA_ROOT: /app/media
      LOG_DIR: /app/logs
      LOG_FILE_NAME: api.log
      LOG_TO_FILE: "true"
    command:
      - sh
      - /app/docker/run-api.sh
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${UVICORN_WORKERS:-1}
      - --proxy-headers
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - mangalclubs_media:/app/media
      - mangalclubs_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${API_MEMORY_LIMIT:-384m}

  worker:
    build:
      context: .
    image: mangalclubs-core:local
    container_name: mangalclubs-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mangalclubs}:${POSTGRES_PASSWORD:-mangalclubs_password}@postgres:5432/${POSTGRES_DB:-mangalclubs}
      MEDIA_ROOT: /app/media
      LOG_DIR: /app/logs
      LOG_FILE_NAME: worker.log
      LOG_TO_FILE: "true"
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - mangalclubs_media:/app/media
      - mangalclubs_logs:/app/logs
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}

  caddy:
    image: caddy:2-alpine
    container_name: mangalclubs-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}

  backup:
    image: postgres:16-alpine
    container_name: mangalclubs-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mangalclubs}
      POSTGRES_USER: ${POSTGRES_USER:-mangalclubs}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mangalclubs_password}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["sh", "/backup/postgres-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/postgres-backup.sh:/backup/postgres-backup.sh:ro
      - ./backups:/backups
      - mangalclubs_media:/media:ro
    mem_limit: ${BACKUP_MEMORY_LIMIT:-128m}

  adminer:
    image: adminer:latest
    container_name: mangalclubs-adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    mem_limit: 128m

volumes:
  mangalclubs_pg_data:
  mangalclubs_media:
  mangalclubs_logs:
  caddy_data:
  caddy_config:
